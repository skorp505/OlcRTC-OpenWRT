name: Rebuild Binaries

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenWRT repo
        uses: actions/checkout@v4

      - name: Clone upstream olcrtc
        working-directory: /tmp
        run: git clone --depth=50 https://github.com/openlibrecommunity/olcrtc.git /tmp/olcrtc-upstream

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'

      - name: Rebuild binaries
        id: rebuild
        run: |
          OUT="$(bash "$GITHUB_WORKSPACE/scripts/rebuild-binaries.sh" /tmp/olcrtc-upstream "$GITHUB_WORKSPACE")"
          echo "$OUT"
          echo "result<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Skip if unchanged
        if: contains(steps.rebuild.outputs.result, 'NO_CHANGE=1')
        run: echo "upstream unchanged, nothing to do"

      - name: Update version and changelog
        if: ${{ ! contains(steps.rebuild.outputs.result, 'NO_CHANGE=1') }}
        run: |
          cd "$GITHUB_WORKSPACE"
          SHA="$(git -C /tmp/olcrtc-upstream rev-parse --short HEAD)"
          VER="$(cat panel-version)"
          MAJOR="${VER%%.*}"
          VER_BODY="${VER#*.}"
          MINOR="${VER_BODY%%.*}"
          NEW_VER="${MAJOR}.$((MINOR + 1)).0"
          echo "$NEW_VER" > panel-version
          TMP="$(mktemp)"
          { echo "## $NEW_VER"; echo "- Пересобраны бинарники olcrtc (amd64/arm64) из upstream ($SHA)."; echo "- Синхронизированы словари names/surnames."; echo ""; cat CHANGELOG.md; } > "$TMP"
          mv "$TMP" CHANGELOG.md
          git -C /tmp/olcrtc-upstream rev-parse HEAD > .upstream-sha
          echo "version=$NEW_VER upstream=$SHA" >&2

      - name: Commit and push
        if: ${{ ! contains(steps.rebuild.outputs.result, 'NO_CHANGE=1') }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add olcrtc-linux-amd64 olcrtc-linux-arm64 files/etc/olcrtc/data/names files/etc/olcrtc/data/surnames panel-version CHANGELOG.md .upstream-sha scripts/rebuild-binaries.sh
          SHA="$(git -C /tmp/olcrtc-upstream rev-parse --short HEAD)"
          git commit -m "Rebuild olcrtc binaries from upstream $SHA"
          git push origin main